name: Test and deploy

on:
  push:
    branches: [main]
  # Pull requests run the suite but never publish. Nothing opens one here by
  # hand -- this is for Dependabot, whose requests would otherwise arrive with
  # no check on them at all, and whose auto-merge waits on the `test` job below.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default, so the job that runs a pull request's code -- which on
# this repo means whatever Dependabot proposes -- cannot publish to Pages or
# mint an OIDC token. Only the deploy job below is trusted with those, and only
# on main.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it half-published. Pull
# requests get a group of their own, so a superseded one can be cancelled
# without ever queueing behind -- or worse, interrupting -- a live deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The runner image ships Chrome, so the real-browser suite runs here too;
      # test/render.js skips itself if it cannot find one.
      - name: Run the suite
        run: ./test/all.sh 100

  deploy:
    needs: test
    # A pull request is tested, not published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
