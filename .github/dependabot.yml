# Dependabot's version updates.
#
# Alerts and security fixes are repository settings and are already on; this
# file is the other half -- routine bumps, on a schedule, whether or not
# anything is vulnerable.
#
# Grouped rather than one pull request per package. Ungrouped, a quiet week is
# still five or six pull requests, each one a full run of a suite that takes
# six minutes and drives a real browser. Minor and patch travel together in a
# single request that the auto-merge workflow can take in one go; anything
# major is left out of the group deliberately, so it arrives on its own and
# waits to be looked at.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types:
          - minor
          - patch

  # The workflows pin their actions, so they go stale the same way packages do
  # -- and more quietly. The Node 20 deprecation warning on every run of the
  # deploy is exactly the kind of thing this is here to clear.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Ten rather than five. Majors are ungrouped by design, so they arrive one
    # per request and sit until they are read -- and five of them was already
    # the whole allowance, which meant actions/setup-node had no request at all
    # and the Node 20 warning this file was meant to clear would have survived
    # merging every one of them.
    open-pull-requests-limit: 10
    groups:
      actions:
        # The three actions that publish the site are held out of the group on
        # purpose, so they are never merged automatically. A pull request runs
        # the suite but deliberately does not deploy, so the check that clears a
        # merge is the one check that never exercises them: a bump that broke
        # publishing would go green, merge itself, and first be seen as a failed
        # deploy on main. Held back, they arrive on their own and get read.
        exclude-patterns:
          - actions/configure-pages
          - actions/upload-pages-artifact
          - actions/deploy-pages
        update-types:
          - minor
          - patch
